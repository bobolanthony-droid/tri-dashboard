name: Daily dashboard

on:
  schedule:
    # 08:00 Europe/London all year. Cron is UTC only, so both slots fire and the gate job
    # cancels the one that isn't 08:00 London (07:00 UTC in summer time, 08:00 UTC in winter).
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      full_resync:
        description: "Re-pull the full intervals.icu history (e.g. after importing older activities)"
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Keep only the 08:00 London slot
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          SLOT: ${{ github.event.schedule }}
        run: |
          off=$(TZ=Europe/London date +%z)
          if { [ "$SLOT" = "0 7 * * *" ] && [ "$off" = "+0100" ]; } || { [ "$SLOT" = "0 8 * * *" ] && [ "$off" = "+0000" ]; }; then
            echo "08:00 London slot ($SLOT UTC, London UTC$off): running"
            exit 0
          fi
          echo "Not the 08:00 London slot ($SLOT UTC, London UTC$off): cancelling"
          gh run cancel "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY"
          sleep 120

  build-deploy:
    needs: gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
      INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
      DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Restore encrypted data cache
        uses: actions/cache/restore@v4
        with:
          path: cache
          key: icu-data-${{ github.run_id }}
          restore-keys: icu-data-

      - run: python cache_crypt.py unpack
      - run: python sync.py ${{ inputs.full_resync && '--full' || '' }}
      - run: python build.py
      - run: python cache_crypt.py pack

      - name: Save encrypted data cache
        uses: actions/cache/save@v4
        with:
          path: cache
          key: icu-data-${{ github.run_id }}

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4

      # GitHub disables schedules in repos with no activity for 60 days; re-enabling resets that.
      - name: Keep schedule alive
        run: gh workflow enable daily.yml -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
